# Windows build gate. Companion to ci.yml (Linux + macOS); see n00b#239.
#
# This was workflow_dispatch-only and took the NCC run id as a HAND-ENTERED
# input, which cannot run per-PR. It now triggers on pull_request and resolves
# that run id itself.
#
# It still CONSUMES NCC's prebuilt artifact rather than building ncc from
# source. That is deliberate and is asserted by
# scripts/test_windows_component_workflow.py ("n00b must consume NCC's artifact
# instead of rebuilding it"); this change keeps that policy intact.
#
# What it adds is a constraint that was previously left to whoever typed the
# input: the artifact must come from a successful NCC run whose head_sha is
# exactly NCC_REV_DEFAULT, parsed out of build.sh. Otherwise Windows silently
# tests a different compiler than Linux and macOS, which is not a gate.
#
# NOTE: this requires NCC_REV_DEFAULT to be at or past ncc 4cd3d8a, which is
# where ncc gained Windows support. The pin bump in #238 satisfies that; on a
# pin older than 4cd3d8a there will be no Windows artifact to find, and this
# job will fail with a clear message rather than silently.
#
# Still build-only. Running the suite on Windows is a later phase, same staging
# as ci.yml -- the one previously-green run executed exactly one test, so
# "Windows builds" is established and "Windows passes" is not.
name: Windows validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ncc_run_id:
        description: >-
          Optional NCC Windows run to consume. Leave empty to auto-resolve the
          newest successful run matching NCC_REV_DEFAULT from build.sh.
        required: false
        default: ""
      ncc_sha:
        description: >-
          Optional exact NCC revision to require. Leave empty to use
          NCC_REV_DEFAULT from build.sh.
        required: false
        default: ""
      libgit2_ref:
        description: Exact libgit2 revision validated with n00b
        required: true
        default: 44c05e5d12f2b8b86b9730bb50f27daf74143782

concurrency:
  group: win-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    # Matches ci.yml: a cold build (libgit2 from source + ~1800 targets) does
    # not reliably fit in 90 minutes.
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout n00b
        uses: actions/checkout@v5
        with:
          path: n00b

      - name: Validate workflow contract
        working-directory: n00b
        run: python scripts/test_windows_component_workflow.py

      # The pin is the single source of truth for which compiler every platform
      # builds with. Parsed from build.sh so Windows cannot drift from ci.yml.
      - name: Resolve ncc pin
        id: ncc
        working-directory: n00b
        shell: bash
        run: |
          set -euo pipefail
          want="${{ inputs.ncc_sha }}"
          if [ -z "${want}" ]; then
            want=$(sed -n 's/^NCC_REV_DEFAULT="\(.*\)"$/\1/p' build.sh | head -1)
          fi
          if [ -z "${want}" ]; then
            echo "::error::could not parse NCC_REV_DEFAULT from build.sh"
            exit 1
          fi
          echo "sha=${want}" >> "$GITHUB_OUTPUT"
          echo "ncc pin: ${want}"

      - name: Resolve NCC producer run
        id: nccrun
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_SHA: ${{ steps.ncc.outputs.sha }}
          GIVEN_RUN: ${{ inputs.ncc_run_id }}
        run: |
          if ($env:GIVEN_RUN) {
            $runId = $env:GIVEN_RUN
          } else {
            # Newest successful windows-ncc-build at exactly the pinned sha.
            $runs = gh api "repos/crashappsec/ncc/actions/runs?head_sha=$env:WANT_SHA&status=success&per_page=100" | ConvertFrom-Json
            $match = @($runs.workflow_runs | Where-Object { $_.name -eq "windows-ncc-build" }) |
                     Sort-Object -Property created_at -Descending | Select-Object -First 1
            if (-not $match) {
              throw ("No successful windows-ncc-build run found for NCC_REV_DEFAULT $env:WANT_SHA. " +
                     "If the pin predates ncc 4cd3d8a it has no Windows support; bump the pin. " +
                     "Otherwise NCC has not published a Windows build for that revision yet.")
            }
            $runId = $match.id
          }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $run = gh api "repos/crashappsec/ncc/actions/runs/$runId" | ConvertFrom-Json
          if ($run.status -ne "completed" -or $run.conclusion -ne "success") {
            throw "NCC run $runId is not successful."
          }
          if ($run.head_sha -ne $env:WANT_SHA) {
            throw "NCC run built $($run.head_sha), expected $env:WANT_SHA."
          }
          if ($run.name -ne "windows-ncc-build") {
            throw "Unexpected NCC workflow: $($run.name)"
          }

      - name: Download NCC artifact
        uses: actions/download-artifact@v6
        with:
          name: ncc-windows-x64
          repository: crashappsec/ncc
          run-id: ${{ steps.nccrun.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ncc-artifact

      - name: Checkout libgit2
        uses: actions/checkout@v5
        with:
          repository: libgit2/libgit2
          ref: ${{ inputs.libgit2_ref || '44c05e5d12f2b8b86b9730bb50f27daf74143782' }}
          path: libgit2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --user meson ninja
          python -c "import sysconfig; print(sysconfig.get_path('scripts', 'nt_user'))" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install llvm-mingw Clang toolchain
        run: |
          $tag = "20260616"
          $archive = "llvm-mingw-$tag-ucrt-x86_64.zip"
          $root = Join-Path $env:RUNNER_TEMP "llvm-mingw-$tag"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/$archive" -OutFile (Join-Path $env:RUNNER_TEMP $archive)
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP $archive) -DestinationPath $root -Force
          $bin = (Get-ChildItem -LiteralPath $root -Directory | Select-Object -First 1).FullName + "\bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build libgit2
        working-directory: libgit2
        run: |
          cmake -S . -B build-codex-win-clean -A x64 -DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=OFF -DBUILD_CLI=OFF
          cmake --build build-codex-win-clean --config RelWithDebInfo --target libgit2package
          foreach ($path in @("build-codex-win-clean\include\git2.h", "build-codex-win-clean\RelWithDebInfo\git2.lib")) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "libgit2 output missing: $path" }
          }

      - name: Build and test n00b
        working-directory: n00b
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio installation with the VC x64 toolset found." }
          Import-Module (Join-Path $vs "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64" | Out-Null

          $ncc = @(Get-ChildItem -LiteralPath ..\ncc-artifact -Recurse -Filter "ncc-*-windows-x64.exe" -File)
          if ($ncc.Count -ne 1) { throw "Expected one NCC executable, got $($ncc.Count)." }
          & $ncc[0].FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Downloaded NCC executable did not run." }

          $rtBuiltins = (& clang --target=x86_64-w64-windows-gnu -rtlib=compiler-rt -print-libgcc-file-name).Trim()
          if (-not (Test-Path -LiteralPath $rtBuiltins -PathType Leaf)) {
            throw "compiler-rt builtins archive not found: $rtBuiltins"
          }
          $git2Bin = (Resolve-Path ..\libgit2\build-codex-win-clean\RelWithDebInfo).Path
          $env:PATH = "$git2Bin;$env:PATH"
          $mesonArgs = @(
            # Required for the test targets to COMPILE, not merely to be built
            # by default (n00b#319). meson.build:131 ties N00B_DEBUG to this
            # option -- `conf_debug = get_option('enable_debug') or
            # n00b_build_tests` -- and several tests hard-require it:
            #
            #   test_rocs_plan_dispatch.c:38: error: "test_rocs_plan_dispatch
            #   requires N00B_DEBUG; configure the build dir with
            #   -Dbuild_tests=true"
            #
            # That #error is deliberate (n00b#258): those tests assert ON
            # counters that only exist under N00B_DEBUG, so stubbing them out
            # would leave the assertions passing vacuously. Before this job ran
            # any of them the flag was unnecessary, which is why it was absent.
            "-Dbuild_tests=true",
            "-Dc_args=--target=x86_64-pc-windows-msvc",
            "-Dc_link_args=--target=x86_64-pc-windows-msvc -fuse-ld=lld -llegacy_stdio_definitions $rtBuiltins"
          )
          # SETUP ONLY. Configuring defines every test target; it does not
          # compile them. That distinction is load-bearing here -- see the
          # target selection below.
          .\build.ps1 -BuildDir build_windows_component -BuildType release -NccPath $ncc[0].FullName -MesonArgs $mesonArgs -LogPath n00b-windows.log -SetupOnly
          if ($LASTEXITCODE -ne 0) { throw "n00b configure failed with exit code $LASTEXITCODE" }
          # n00b#319. This used to run exactly one test -- `condition` -- so a
          # green Windows job meant "libn00b compiles and links" and nothing
          # about runtime behaviour. Zero rocs and zero dict tests had ever
          # executed on Windows, which are the two subsystems with the most
          # platform-sensitive behaviour in the tree (file handles, mmap,
          # futex/park, atomics).
          #
          # That gap shipped a defect: #296's reader-strand spin bound reached
          # a published wax release (v0.8.49) having never run on Windows, and
          # flaked on its first Windows execution -- caught by a DOWNSTREAM
          # consumer's suite (crashappsec/wax#792), not by this job, which was
          # green twice on that same commit.
          #
          # The rocs + dict subset rather than the full suite, per the option
          # #319 itself recommends: it covers the surface that produced that
          # incident at a fraction of the cost. Measured on macOS the same 66
          # targets run in 162s at --num-processes 4; the full gated suite is
          # 525 tests and would put this job past 40 minutes on the per-PR
          # path it has been on since #253.
          #
          # `condition` is kept explicitly -- it is the timeout-semantics test
          # this job has always run, and dropping it would trade coverage for
          # coverage.
          #
          # EXPECT FAILURES ON FIRST ENABLEMENT. Some of these have never run
          # on Windows. That is the point: the alternative is finding them one
          # downstream release at a time.
          # The --list MUST carry the same --no-suite flags as the run.
          # Naming a test explicitly overrides suite exclusion, so listing
          # unfiltered would drag in rocs_plan_oracle (quarantined for a
          # Linux timeout), rocs_query_stress and rocs_async_seal_stress --
          # 68 targets instead of 67, three of them things this repo has
          # deliberately decided not to gate on.
          $suiteArgs = @('--no-suite', 'known-broken', '--no-suite', 'stress')
          $rocsDict = (meson test -C build_windows_component @suiteArgs --list) |
            ForEach-Object { ($_ -split ':')[-1].Trim() } |
            Where-Object { $_ -match '^(rocs|dict)' }
          $testNames = @('condition') + $rocsDict

          # Build ONLY the tests that are about to run, not `ninja all`.
          #
          # -Dbuild_tests=true is required for these targets to compile at all
          # (it is what turns on N00B_DEBUG), but it also DEFINES every other
          # test target in the tree -- and a plain `ninja` then compiles all of
          # them. About 40 of those include <pthread.h>, <sys/socket.h>,
          # <netinet/in.h> or <sys/select.h>, none of which this target
          # provides, so the build died before running a single test:
          #
          #   test_http_proxy_https_plaintext.c:30:10:
          #       fatal error: 'pthread.h' file not found
          #
          # Those tests are POSIX-only by construction (raw sockets, direct
          # pthread_create) and none of them match the rocs|dict filter, so
          # they would not have run on Windows even if they had compiled.
          # Porting ~40 QUIC/HTTP socket tests to Winsock is a real project;
          # blocking this job on it would mean rocs and dict stay unrun on
          # Windows meanwhile, which is the exact gap n00b#319 exists to close.
          # Tracked separately for whoever takes that on.
          #
          # Targets come from meson's own introspection rather than a guessed
          # `test_` + name, so a test whose executable is named differently
          # from its test name still builds.
          $intro = Get-Content build_windows_component/meson-info/intro-tests.json -Raw | ConvertFrom-Json
          # Note 65 targets for 68 tests is expected, not a bug: several tests
          # share one executable and differ only by argv (dict_reader_strand
          # runs a 'get' and an 'add' case that way).
          # cmd[0] is the test binary; `depends` carries anything else the test
          # needs at RUNTIME -- e.g. rocs_wax_cli spawns the n00b-rocs-wax-cache
          # tool, which is a separate executable and not named by cmd[0]. Under
          # `ninja all` that distinction never mattered; building only what runs
          # makes it load-bearing, so take both.
          $selected = $intro | Where-Object { $testNames -contains $_.name }
          $allBases = @(
            $selected | ForEach-Object { [System.IO.Path]::GetFileName($_.cmd[0]) }
            # depends entries look like 'n00b-rocs-wax-cache@exe'; ninja wants
            # the target name, so drop the @suffix and add the .exe this
            # platform builds.
            $selected | ForEach-Object { $_.depends } |
              Where-Object { $_ } |
              ForEach-Object { ($_ -split '@')[0] + '.exe' }
          ) | Sort-Object -Unique
          $targets = $allBases | Where-Object { $_ -like '*.exe' }
          # Anything dropped here is a test driven by an interpreter rather
          # than a built binary. None exist in this set today; say so out loud
          # if that changes, because the symptom would otherwise be a
          # confusing --no-rebuild miss much later.
          $dropped = $allBases | Where-Object { $_ -notlike '*.exe' }
          if ($dropped) { Write-Host "not ninja targets, skipped: $($dropped -join ', ')" }
          if ($targets.Count -eq 0) { throw "no test targets resolved -- introspection or filter is wrong" }
          Write-Host "building $($targets.Count) test targets for $($testNames.Count) tests"
          .\build.ps1 -BuildDir build_windows_component -BuildType release -NccPath $ncc[0].FullName -MesonArgs $mesonArgs -LogPath n00b-windows.log -Target $targets
          if ($LASTEXITCODE -ne 0) { throw "n00b build failed with exit code $LASTEXITCODE" }

          # --no-rebuild: meson would otherwise run `ninja all` itself before
          # testing, reintroducing exactly the compile failures avoided above.
          meson test -C build_windows_component --print-errorlogs --no-rebuild `
            --num-processes 4 @suiteArgs condition @rocsDict
          if ($LASTEXITCODE -ne 0) { throw "n00b Windows test suite failed with exit code $LASTEXITCODE" }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n00b-windows-validation-${{ github.sha }}
          path: |
            n00b/n00b-windows.log
            n00b/build_windows_component/meson-logs/**
          if-no-files-found: warn
